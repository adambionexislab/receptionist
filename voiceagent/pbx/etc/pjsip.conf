[global]
type=global
user_agent=Apollonia
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; TLS transport for OUTBOUND calls to OpenAI (inbound 5061 is closed by the firewall)
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2
ca_list_file=/etc/ssl/certs/ca-certificates.crt
verify_server=yes
allow_wildcard_certs=yes   ; OpenAI cert: CN=api.openai.com, SAN *.api.openai.com

; -- DIDWW -> Apollonia (the new Eleven trunk) --
[didww-eleven]
type=endpoint
transport=transport-udp
context=from-didww-eleven
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes

[didww-eleven-identify]
type=identify
endpoint=didww-eleven
match=46.19.209.14
match=46.19.210.14
match=46.19.212.14
match=46.19.213.14
match=46.19.214.14
match=46.19.215.14
match=185.238.173.14

; -- Asterisk -> OpenAI SIP (the fallback) --
[openai-sip]
type=endpoint
transport=transport-tls
context=from-openai          ; OpenAI never calls in; this context stays empty
disallow=all
allow=ulaw,alaw
aors=openai-sip
direct_media=no
media_encryption=sdes        ; matches the existing DIDWW -> OpenAI trunk (SRTP SDES)

[openai-sip]
type=aor
contact=sip:proj_34LHXs57ZcnMu1aSmvk9RQYO@sip.api.openai.com:5061;transport=tls
