services:
  - type: web
    name: ai-receptionist
    # Docker, not the native Python runtime, since the AI video tour landed:
    # ffmpeg is a system binary and Chromium needs system libraries, and the
    # native runtime offers neither apt nor root. See backend/Dockerfile.
    #
    # Both paths below are relative to the REPO ROOT, not to rootDir — that is
    # Render's rule for these two fields specifically, and it differs from the
    # old buildCommand/startCommand, which ran from the service's root
    # directory. Hence ./backend/ on both rather than ./.
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # starter (512 MB / 0.5 CPU) is not enough once a tile capture runs here:
    # software-WebGL Chromium plus an ffmpeg encode share this instance with
    # live phone calls. A Render disk attaches to exactly one service, so the
    # pipeline cannot be split onto a worker without moving media off-disk.
    plan: standard
    disk:
      name: data
      mountPath: /data
      # Was 1 GB, which held only the SQLite file. A tour peaks around 145 MB
      # mid-pipeline and settles near 85 MB, so 1 GB is roughly 10-20 tours —
      # and a full disk takes receptionist.db down with it, not just the video.
      # The retention sweeper (videotour/pipeline.py) keeps this from growing
      # without bound; the headroom is what covers a busy week between sweeps.
      sizeGB: 10
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_PHONE_NUMBER_SK
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LEAD_EMAIL
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: IMMOBILIARE_SEARCH_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ACQUISIZIONE_ENABLED
        value: "false"
      - key: REALTIME_TRANSCRIBE_MODEL
        value: gpt-realtime-whisper
      # minimal|low|medium|high|xhigh — accuracy over live immediacy.
      - key: REALTIME_TRANSCRIBE_DELAY
        value: xhigh
      # Text reasoning models — keep these two in step unless one task is
      # deliberately being pinned to a different model.
      - key: SUMMARY_MODEL
        value: gpt-5.6-terra
      - key: EXTRACTION_MODEL
        value: gpt-5.6-terra
      - key: IMAGE_EDIT_MODEL
        value: gpt-image-2
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Shared staff password for /leadgen. Without it nobody can log in.
      - key: LEADGEN_PASSWORD
        sync: false
      - key: OUTREACH_FROM_EMAIL
        sync: false
      - key: CALENDLY_LINK
        sync: false
      # ── AI video tour ─────────────────────────────────────────────────────
      # Ships dark until this is "true", like ACQUISIZIONE_ENABLED above.
      - key: VIDEO_TOUR_ENABLED
        value: "false"
      # Server-side key. Geocoding API must be enabled on it.
      - key: GOOGLE_GEOCODING_API_KEY
        sync: false
      # Embedded in the dashboard page for the draggable-marker map, so this
      # MUST be a separate key restricted by HTTP referrer, with only the Maps
      # JavaScript API enabled. Never reuse GOOGLE_PLACES_API_KEY here.
      # Cloud-configured Map ID. Without it the wizard falls back to the legacy
      # draggable Marker; set it to use AdvancedMarkerElement instead.
      - key: GOOGLE_MAPS_MAP_ID
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      # Map Tiles API (Photorealistic 3D Tiles), read server-side by the
      # headless Cesium capture.
      - key: GOOGLE_MAP_TILES_API_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: RUNWAY_API_VERSION
        value: "2024-11-06"
      # Seedance 2.5 is the model because it is the only family in Runway's API
      # with multi-image reference mode — gen4.5/gen4_turbo take a first frame
      # only, so they cannot cover several rooms in one generation.
      - key: RUNWAY_VIDEO_MODEL
        value: seedance2_5
      # 854:480 | 1280:720 | 1920:1080 — 20 / 30 / 68 credits per second of
      # output. This is the single biggest cost lever on the feature.
      - key: RUNWAY_VIDEO_RATIO
        value: "1280:720"
      - key: VIDEO_TOUR_MAX_INTERIOR_PHOTOS
        value: "8"
